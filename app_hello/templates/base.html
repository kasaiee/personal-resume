<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Directory</title>

  <!-- Same font used by resume.html -->
  <link href="https://fonts.googleapis.com/css?family=Lato:400,300,700" rel="stylesheet">

  {% block css %}
    <style>
        /* =========================================================
        RESUME DESIGN SYSTEM - SHARED
        ========================================================= */

        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        html {
        height: 100%;
        }

        body {
        min-height: 100%;
        background: #eee;
        font-family: "Lato", sans-serif;
        font-weight: 400;
        color: #222;
        font-size: 14px;
        line-height: 26px;
        padding-bottom: 50px;
        }


        /* =========================================================
        RESUME DETAIL PAGE
        Existing resume.html styles
        These selectors are kept compatible with the current HTML.
        ========================================================= */

        .container {
        max-width: 700px;
        background: #fff;
        margin: 0 auto;
        box-shadow: 1px 1px 2px #dad7d7;
        border-radius: 3px;
        padding: 40px;
        margin-top: 50px;
        }

        .header {
        margin-bottom: 30px;
        }

        .header .full-name {
        font-size: 40px;
        text-transform: uppercase;
        margin-bottom: 5px;
        }

        .header .first-name {
        font-weight: 700;
        }

        .header .last-name {
        font-weight: 300;
        }

        .header .contact-info {
        margin-bottom: 20px;
        }

        .header .email,
        .header .phone {
        color: #999;
        font-weight: 300;
        }

        .header .separator {
        height: 10px;
        display: inline-block;
        border-left: 2px solid #999;
        margin: 0 10px;
        }

        .header .position {
        font-weight: bold;
        display: inline-block;
        margin-right: 10px;
        text-decoration: underline;
        }

        .details {
        line-height: 20px;
        }

        .details .section {
        margin-bottom: 40px;
        }

        .details .section:last-of-type {
        margin-bottom: 0;
        }

        .details .section__title {
        letter-spacing: 2px;
        color: #54afe4;
        font-weight: bold;
        margin-bottom: 10px;
        text-transform: uppercase;
        }

        .details .section__list-item {
        margin-bottom: 40px;
        }

        .details .section__list-item:last-of-type {
        margin-bottom: 0;
        }

        .details .left,
        .details .right {
        vertical-align: top;
        display: inline-block;
        }

        .details .left {
        width: 60%;
        }

        .details .right {
        text-align: right;
        width: 39%;
        }

        .details .name {
        font-weight: bold;
        }

        .details a {
        text-decoration: none;
        color: #000;
        font-style: italic;
        }

        .details a:hover {
        text-decoration: underline;
        color: #000;
        }

        .details .skills__item {
        margin-bottom: 10px;
        }

        .details .skills__item .right input {
        display: none;
        }

        .details .skills__item .right label {
        display: inline-block;
        width: 20px;
        height: 20px;
        background: #c3def3;
        border-radius: 20px;
        margin-right: 3px;
        }

        .details .skills__item .right input:checked + label {
        background: #79a9ce;
        }


        /* =========================================================
        RESUME DIRECTORY / LIST PAGE
        All list-page selectors use the "resume-" namespace so they
        cannot collide with the resume detail page.
        ========================================================= */

        .resume-directory {
        max-width: 1100px;
        margin: 50px auto 0;
        background: #fff;
        box-shadow: 1px 1px 2px #dad7d7;
        border-radius: 3px;
        overflow: hidden;
        }

        .resume-directory__header {
        padding: 28px 30px 24px;
        border-bottom: 1px solid #eee;
        }

        .resume-directory__title {
        font-size: 30px;
        line-height: 36px;
        font-weight: 700;
        margin-bottom: 3px;
        }

        .resume-directory__subtitle {
        color: #999;
        font-weight: 300;
        }

        .resume-directory__accent {
        color: #54afe4;
        }

        .resume-directory__body {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        min-height: 700px;
        }


        /* Filters */

        .resume-filters {
        padding: 28px 24px;
        border-right: 1px solid #eee;
        background: #fff;
        }

        .resume-section-title {
        letter-spacing: 2px;
        color: #54afe4;
        font-weight: 700;
        margin-bottom: 10px;
        text-transform: uppercase;
        font-size: 12px;
        line-height: 18px;
        }

        .resume-filter-group {
        margin-bottom: 25px;
        }

        .resume-filter-group:last-child {
        margin-bottom: 0;
        }

        .resume-input,
        .resume-select {
        width: 100%;
        height: 42px;
        border: 1px solid #c3def3;
        border-radius: 3px;
        background: #fff;
        color: #222;
        font: inherit;
        font-size: 13px;
        padding: 0 12px;
        outline: none;
        }

        .resume-input:focus,
        .resume-select:focus {
        border-color: #79a9ce;
        }

        .resume-input::placeholder {
        color: #999;
        }

        .resume-filter-check {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 7px;
        color: #555;
        font-size: 13px;
        line-height: 22px;
        cursor: pointer;
        }

        .resume-filter-check input {
        width: 15px;
        height: 15px;
        accent-color: #79a9ce;
        cursor: pointer;
        }

        .resume-filter-actions {
        margin-top: 30px;
        }

        .resume-button {
        width: 100%;
        height: 40px;
        border-radius: 3px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease;
        }

        .resume-button--primary {
        color: #fff;
        background: #54afe4;
        border: 1px solid #54afe4;
        }

        .resume-button--primary:hover {
        background: #79a9ce;
        border-color: #79a9ce;
        }

        .resume-button--secondary {
        margin-top: 9px;
        color: #555;
        background: #fff;
        border: 1px solid #c3def3;
        }

        .resume-button--secondary:hover {
        border-color: #79a9ce;
        color: #222;
        }


        /* Results */

        .resume-results {
        min-width: 0;
        padding: 28px 30px;
        }

        .resume-results__toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        }

        .resume-results__count {
        font-size: 25px;
        line-height: 32px;
        font-weight: 700;
        }

        .resume-results__count span {
        color: #999;
        font-size: 14px;
        font-weight: 300;
        vertical-align: middle;
        }

        .resume-sort {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #999;
        font-size: 13px;
        white-space: nowrap;
        }

        .resume-sort select {
        height: 36px;
        min-width: 140px;
        border: 1px solid #c3def3;
        border-radius: 3px;
        padding: 0 9px;
        background: #fff;
        color: #222;
        font: inherit;
        outline: none;
        }


        /* Candidate cards */

        .resume-card {
        border: 1px solid #c3def3;
        border-radius: 3px;
        padding: 22px 18px 20px;
        margin-bottom: 14px;
        background: #fff;
        }

        .resume-card__grid {
        display: grid;
        grid-template-columns:
            minmax(190px, 1.15fr)
            minmax(150px, .9fr)
            minmax(150px, .9fr)
            90px;
        gap: 22px;
        align-items: start;
        }

        .resume-card__name {
        font-size: 19px;
        line-height: 24px;
        font-weight: 700;
        margin-bottom: 2px;
        }

        .resume-card__role {
        color: #54afe4;
        font-weight: 700;
        margin-bottom: 9px;
        font-size: 13px;
        }

        .resume-card__meta {
        color: #777;
        font-size: 12px;
        line-height: 19px;
        margin-bottom: 8px;
        }

        .resume-card__summary {
        color: #555;
        font-size: 12px;
        line-height: 19px;
        margin-top: 10px;
        }

        .resume-card__label {
        letter-spacing: 2px;
        color: #54afe4;
        font-weight: 700;
        margin-bottom: 7px;
        text-transform: uppercase;
        font-size: 10px;
        line-height: 15px;
        }

        .resume-card__item {
        margin-bottom: 13px;
        }

        .resume-card__item:last-child {
        margin-bottom: 0;
        }

        .resume-card__item-name {
        font-weight: 700;
        font-size: 12px;
        line-height: 17px;
        }

        .resume-card__item-detail {
        color: #555;
        font-size: 11px;
        line-height: 16px;
        }

        .resume-card__skills {
        margin-top: 14px;
        }

        .resume-skill {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 7px;
        align-items: center;
        margin-bottom: 3px;
        }

        .resume-skill__name {
        font-size: 11px;
        line-height: 16px;
        }

        .resume-skill__dots {
        display: flex;
        gap: 3px;
        }

        .resume-skill__dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c3def3;
        }

        .resume-skill__dot.is-active {
        background: #79a9ce;
        }

        .resume-card__action {
        display: flex;
        justify-content: flex-end;
        }

        .resume-view-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        padding: 0 11px;
        border: 1px solid #c3def3;
        border-radius: 3px;
        color: #54afe4;
        background: #fff;
        font-size: 12px;
        white-space: nowrap;
        text-decoration: none;
        }

        .resume-view-button:hover {
        color: #54afe4;
        border-color: #79a9ce;
        text-decoration: none;
        }

        .resume-view-button__arrow {
        margin-left: 7px;
        font-size: 15px;
        line-height: 1;
        }


        /* Pagination */

        .resume-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 22px;
        }

        .resume-pagination__buttons {
        display: flex;
        gap: 5px;
        }

        .resume-page {
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid #c3def3;
        border-radius: 3px;
        background: #fff;
        color: #555;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
        }

        .resume-page:hover {
        border-color: #79a9ce;
        }

        .resume-page.is-active {
        background: #54afe4;
        border-color: #54afe4;
        color: #fff;
        }

        .resume-pagination__info {
        color: #999;
        font-size: 12px;
        }


        /* =========================================================
        RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {
        .resume-directory {
            margin: 25px 20px 0;
        }

        .resume-directory__body {
            grid-template-columns: 210px minmax(0, 1fr);
        }

        .resume-card__grid {
            grid-template-columns: 1fr 1fr 80px;
        }

        .resume-card__profile {
            grid-column: 1 / -1;
        }
        }

        @media (max-width: 700px) {
        body {
            font-size: 13px;
        }

        .resume-directory {
            margin: 15px 10px 0;
        }

        .resume-directory__header {
            padding: 22px 20px;
        }

        .resume-directory__body {
            display: block;
        }

        .resume-filters {
            border-right: 0;
            border-bottom: 1px solid #eee;
            padding: 22px 20px;
        }

        .resume-results {
            padding: 22px 20px;
        }

        .resume-results__toolbar {
            align-items: flex-start;
            flex-direction: column;
        }

        .resume-card__grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .resume-card__profile {
            grid-column: auto;
        }

        .resume-card__action {
            justify-content: flex-start;
        }

        .resume-pagination {
            align-items: flex-start;
            flex-direction: column;
            gap: 12px;
        }
        }
        .resume-page {
            text-decoration: none;
        }

        .nav {
            background-color: #fff;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
        }

        .errorlist {
            color: red
        }
    </style>
    {% endblock css %}

</head>
{% include "components/nav.html" %}
{% block content %}{% endblock content %}
{% block js %}{% endblock js %}
<body>
